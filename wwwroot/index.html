<body>
    <!-- Регистрация -->
    <div id="registerView" class="auth-screen">
        <div class="auth-card">
            <div class="auth-logo">💬</div>
            <h1>Создать аккаунт</h1>

            <input id="regLogin" placeholder="Логин">
            <input id="regName" placeholder="Имя">
            <input id="regPassword" type="password" placeholder="Пароль">
            <button class="primary-btn" onclick="registerUser()">Зарегистрироваться</button>

            <div class="switch-link" onclick="showView('login')">Уже есть аккаунт? Войти</div>
            <div id="regError" class="error-text"></div>
        </div>
    </div>

    <!-- Вход -->
    <div id="loginView" class="auth-screen hidden">
        <div class="auth-card">
            <div class="auth-logo">💬</div>
            <h1>Вход</h1>

            <input id="loginLogin" placeholder="Логин">
            <input id="loginPassword" type="password" placeholder="Пароль">

            <button class="primary-btn" onclick="loginUser()">Войти</button>

            <div class="switch-link" onclick="showView('register')">Нет аккаунта? Зарегистрироваться</div>
            <div id="loginError" class="error-text"></div>
        </div>
    </div>

    <!-- Чат -->
    <div id="chatView" class="chat-screen hidden">

<div class="chat-header">
<button class="back-btn" onclick="backToChatsList()">←</button>
</button>
    <div class="avatar" id="headerAvatar" onclick="document.getElementById('avatarInput').click()"></div>
    <div class="header-title" id="currentRoomTitle">Чат</div>
</div>

        <div id="messages"></div>

              

        <div class="input-bar">
            <input id="messageText"
                   placeholder="Сообщение"
                   onkeydown="if (event.key === 'Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <input type="file" id="avatarInput" accept="image/png,image/jpeg" class="hidden" onchange="uploadAvatar()">

    <script src="/signalr.min.js"></script>

    <script>
        let connection = null;
        let currentUserLogin = '';
        let rooms = [];
        let currentRoomId = null;
        let currentUserId = null;
        let currentName = '';
        let currentAvatar = null;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }

function showView(name) {
    document.getElementById('registerView').classList.add('hidden');
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('chatView').classList.add('hidden');
    document.getElementById('sectionView').classList.add('hidden');
    document.getElementById('chatsListView').classList.add('hidden');

    if (name === 'register') document.getElementById('registerView').classList.remove('hidden');
    if (name === 'login') document.getElementById('loginView').classList.remove('hidden');
    if (name === 'chat') document.getElementById('chatView').classList.remove('hidden');
    if (name === 'section') document.getElementById('sectionView').classList.remove('hidden');
    if (name === 'chatsList') document.getElementById('chatsListView').classList.remove('hidden');
}
         
        
        async function api(url, method = 'GET', body = null) {
            const options = { method, headers: {}, credentials: 'same-origin' };

            if (body) {
                options.headers['Content-Type'] = 'application/json';
                options.body = JSON.stringify(body);
            }

            const response = await fetch(url, options);

            if (!response.ok) {
                let message = 'Ошибка запроса';

                try {
                    const text = await response.text();
                    if (text) {
                        const data = JSON.parse(text);
                        if (data.error) message = data.error;
                    }
                } catch { }

                throw new Error(message);
            }

            const text = await response.text();
            return text ? JSON.parse(text) : null;
        }
        
function openSection(name) {
    document.getElementById('sideMenu').classList.remove('open');

    if (name === 'chats') {
        renderRooms();
        fillPreviews();
        showView('chatsList');
        return;
    }

    if (name === 'profile') {
        showView('section');
        document.getElementById('sectionTitle').textContent = 'Мой профиль';
        document.getElementById('profileScreen').classList.remove('hidden');
        document.getElementById('genericSection').classList.add('hidden');
        fillProfile();
        return;
    }

    const titles = {
        groups: '👥 Группы',
        findFriend: '🔍 Поиск друзей',
        findGroup: '🌐 Поиск группы',
        settings: '⚙️ Настройки'
    };

    showView('section');
    document.getElementById('sectionTitle').textContent = titles[name] || name;
    document.getElementById('profileScreen').classList.add('hidden');
    document.getElementById('genericSection').classList.remove('hidden');
    document.getElementById('genericSection').textContent = titles[name] || name;
}

function fillProfile() {
    const avatarEl = document.getElementById('profileAvatar');
    avatarEl.innerHTML = '';
    if (currentAvatar) {
        const img = document.createElement('img');
        img.src = currentAvatar;
        avatarEl.appendChild(img);
    } else {
        avatarEl.textContent = (currentName || '?').charAt(0).toUpperCase();
    }

    document.getElementById('profileName').textContent = currentName || '';
    document.getElementById('profileLogin').textContent = '@' + (currentUserLogin || '');
}

function confirmLogout() {
    document.getElementById('logoutModal').classList.remove('hidden');
}

function closeLogoutModal() {
    document.getElementById('logoutModal').classList.add('hidden');
}

        function toggleMenu() {
    const menu = document.getElementById('sideMenu');
    menu.classList.toggle('open');
} 

        async function registerUser() {
            try {
                const result = await api('/api/register', 'POST', {
                    login: document.getElementById('regLogin').value,
                    name: document.getElementById('regName').value,
                    password: document.getElementById('regPassword').value
                });
            localStorage.setItem('myLogin', document.getElementById('regLogin').value.trim());
                await afterAuth(result);
            } catch (e) {
                document.getElementById('regError').textContent = e.message;
            }
        }

        async function loginUser() {
            try {
                const result = await api('/api/login', 'POST', {
                    login: document.getElementById('loginLogin').value,
                    password: document.getElementById('loginPassword').value
                });

                localStorage.setItem('myLogin', document.getElementById('loginLogin').value.trim());

                await afterAuth(result);
            } catch (e) {
                document.getElementById('loginError').textContent = e.message;
            }
        }
        async function logout() {
            try { await api('/api/logout', 'POST'); } finally { location.reload(); }
        }

        async function afterAuth(data) {
            currentUserId = data.id;
            currentName = data.name;
            currentAvatar = data.avatarUrl;
            currentUserLogin = localStorage.getItem('myLogin') || '';

            console.log('AUTH DATA:', data);

                setHeaderAvatar();
                showView('chatsList');
                renderRooms();
                fillPreviews();

            if (!connection) {
                connection = new signalR.HubConnectionBuilder()
                    .withUrl('/chathub')
                    .withAutomaticReconnect()
                    .build();

                connection.on('receive', addMessage);
                await connection.start();
            }

            await loadRooms();
        }

        function setHeaderAvatar() {
            const av = document.getElementById('headerAvatar');
            av.innerHTML = '';

            if (currentAvatar) {
                const img = document.createElement('img');
                img.src = currentAvatar;
                av.appendChild(img);
            } else {
                av.textContent = (currentName || '?').charAt(0).toUpperCase();
            }
        }

        async function uploadAvatar() {
            const input = document.getElementById('avatarInput');
            const file = input.files[0];

            if (!file) return;

            const fd = new FormData();
            fd.append('avatar', file);

            try {
                const res = await fetch('/api/avatar', {
                    method: 'POST',
                    body: fd,
                    credentials: 'same-origin'
                });

                const data = await res.json();

                if (!res.ok) {
                    alert(data.error || 'Не удалось загрузить аватар');
                    return;
                }
            currentAvatar = data.avatarUrl;
                setHeaderAvatar();

                if (currentRoomId) {
                    await loadMessages(currentRoomId);
                }
            } catch {
                alert('Ошибка загрузки');
            }

            input.value = '';
        }

        async function loadRooms() {
            rooms = await api('/api/rooms');
            renderRooms();
        }
        
        async function fillPreviews() {
    for (const room of rooms) {
        try {
            const msgs = await api(`/api/rooms/${room.id}/messages`);
            const row = document.querySelector(`.chat-row[data-room-id="${room.id}"]`);
            if (!row) continue;

            const lastEl = row.querySelector('.chat-row-last');
            const timeEl = row.querySelector('.chat-row-time');
            const last = msgs[msgs.length - 1];

            if (last) {
                lastEl.textContent = (last.name ? last.name + ': ' : '') + (last.text || '');
                const t = last.sentAt || last.time || last.createdAt || last.timestamp;
                timeEl.textContent = t ? formatTime(t) : '';
                row.dataset.time = t ? new Date(t).getTime() : 0;
            } else {
                lastEl.textContent = 'Нет сообщений';
                row.dataset.time = 0;
            }
        } catch (e) { }
    }
    sortChatsList();
}
function sortChatsList() {
    const wrap = document.getElementById('chatsList');
    if (!wrap) return;

    const rows = Array.from(wrap.children);
    rows.sort((a, b) => {
        const an = a.querySelector('.chat-row-name').textContent;
        const bn = b.querySelector('.chat-row-name').textContent;
        if (an === 'Общий') return -1;   // «Общий» всегда закреплён сверху
        if (bn === 'Общий') return 1;
        return (Number(b.dataset.time) || 0) - (Number(a.dataset.time) || 0); // свежие сверху
    });
    rows.forEach(r => wrap.appendChild(r));
}

function formatTime(t) {
    const d = new Date(t);
    if (isNaN(d)) return '';
    const now = new Date();
    if (d.toDateString() === now.toDateString()) {
        return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0');
}

        function renderRooms() {
    const wrap = document.getElementById('chatsList');
    if (!wrap) return;
    wrap.innerHTML = '';

    const sorted = [...rooms].sort((a, b) => {
        if (a.name === 'Общий') return -1;
        if (b.name === 'Общий') return 1;
        return 0;
    });

    sorted.forEach(room => {
        const row = document.createElement('div');
        row.className = 'chat-row';
        row.onclick = () => openChat(room.id);
        row.dataset.roomId = room.id;
        const avatar = document.createElement('div');
        avatar.className = 'chat-row-avatar';
        avatar.textContent = room.name === 'Общий' ? '🌐' : room.name.charAt(0).toUpperCase();

        const info = document.createElement('div');
        info.className = 'chat-row-info';

        const name = document.createElement('div');
        name.className = 'chat-row-name';
        name.textContent = room.name;

        const last = document.createElement('div');
        last.className = 'chat-row-last';
        last.textContent = '';

        info.appendChild(name);
        info.appendChild(last);

        const time = document.createElement('div');
        time.className = 'chat-row-time';
        time.textContent = '';

        row.appendChild(avatar);
        row.appendChild(info);
        row.appendChild(time);
        wrap.appendChild(row);
    });
}

        async function createRoom() {
            try {
                const name = document.getElementById('newRoomName').value;

                if (!name.trim()) return;

                const room = await api('/api/rooms', 'POST', { name });

                document.getElementById('newRoomName').value = '';
                document.getElementById('newRoomBar').classList.add('hidden');

                await loadRooms();
                await selectRoom(room.id);
            } catch (e) {
                alert(e.message);
            }
        }

        async function openChat(roomId) {
    await selectRoom(roomId);
    showView('chat');
}

function backToChatsList() {
    renderRooms();
    fillPreviews();
    showView('chatsList');
}

        async function selectRoom(roomId) {
            if (!connection || currentRoomId === roomId) return;

            if (currentRoomId) {
                await connection.invoke('LeaveRoom', currentRoomId);
            }

            currentRoomId = roomId;

            await connection.invoke('JoinRoom', roomId);

            const room = rooms.find(r => r.id === roomId);
            document.getElementById('currentRoomTitle').textContent = room ? room.name : 'Чат';

            await loadMessages(roomId);
            renderRooms();
        }

        async function loadMessages(roomId) {
            document.getElementById('messages').innerHTML = '';

            const messages = await api(`/api/rooms/${roomId}/messages`);
            messages.forEach(addMessage);
        }

        function addMessage(m) {
            const list = document.getElementById('messages');

            const row = document.createElement('div');
            row.className = 'msg' + (m.userId === currentUserId ? ' own' : '');

            const av = document.createElement('div');
            av.className = 'avatar';

            if (m.avatarUrl) {
                const img = document.createElement('img');
                img.src = m.avatarUrl;
                av.appendChild(img);
            } else {
                av.textContent = (m.name || '?').charAt(0).toUpperCase();
            }

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            const nameEl = document.createElement('div');
            nameEl.className = 'msg-name';
            nameEl.textContent = m.name;

            const textEl = document.createElement('div');
            textEl.className = 'msg-text';
            textEl.textContent = m.text;

            bubble.appendChild(nameEl);
            bubble.appendChild(textEl);

            row.appendChild(av);
            row.appendChild(bubble);
            list.appendChild(row);
            list.scrollTop = list.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageText');
            const text = input.value;

            if (!text.trim() || !currentRoomId || !connection) return;

            try {
                await connection.invoke('SendMessage', currentRoomId, text);
                input.value = '';
            } catch (e) {
                alert(e.message);
            }
        }

async function findAndChat() {
    const login = document.getElementById('searchLogin').value.trim();
    if (!login) return;

    const room = await connection.invoke('StartDirectChatByLogin', login);

    if (room) {
        document.getElementById('searchLogin').value = '';
        closeSearchModal();
        await loadRooms();          // обновляем список, чтобы новый чат появился
        await selectRoom(room.id);  // открываем разговор
        showView('chat');           // показываем экран разговора
    } else {
        alert('Пользователь не найден');
    }
}
function openSearchModal() {
    document.getElementById('searchModal').classList.remove('hidden');
}

function closeSearchModal() {
    document.getElementById('searchModal').classList.add('hidden');
}
